name: Release build

# Manual only. Builds the universal DMG the same way scripts/release.sh does on a Mac and
# keeps it as a workflow artifact. It never tags, publishes or pushes anything.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache GPUI sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/zed
          key: zed-${{ hashFiles('scripts/fetch-gpui.sh', 'patches/gpui-*.patch') }}

      - name: Fetch GPUI
        run: ./scripts/fetch-gpui.sh

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # --no-tag: the tag check is for a release made by hand; this run only proves the build.
      - name: Build the DMG
        run: ./scripts/release.sh --no-tag

      - name: Upload the DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crow-dmg
          path: |
            target/release-dmg/Crow-*.dmg
            target/release-dmg/Crow-*.dmg.sha256
          if-no-files-found: error
