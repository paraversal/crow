name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache GPUI sources
        uses: actions/cache@v4
        with:
          path: vendor/zed
          key: zed-${{ hashFiles('scripts/fetch-gpui.sh') }}

      - name: Fetch GPUI
        run: ./scripts/fetch-gpui.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Not --all: that also formats path dependencies, i.e. the vendored Zed crates.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        # spike/ is frozen reference code, deleted with M2.
        run: cargo clippy --workspace --exclude crow-spike --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The frame-time benchmark needs a GPU; hosted macOS runners have none,
      # so it runs locally (see spike/README.md) until a self-hosted runner exists.
      - name: Build release
        run: cargo build --release -p crow-app
