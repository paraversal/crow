name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache GPUI sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/zed
          key: zed-${{ hashFiles('scripts/fetch-gpui.sh', 'patches/gpui-*.patch') }}

      - name: Fetch GPUI
        run: ./scripts/fetch-gpui.sh

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Not --all: that also formats path dependencies, i.e. the vendored Zed crates.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The frame-time benchmark needs a GPU; hosted macOS runners have none,
      # so it runs locally (see docs/testing.md) until a self-hosted runner exists.
      - name: Build release
        run: cargo build --release -p crow-app
