name: Fuzz

# Every three days at 04:00 UTC. Change the cron to run more or less often;
# `workflow_dispatch` runs one on demand with an optional seed.
on:
  schedule:
    - cron: "0 4 */3 * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed (blank: a new one)"
        required: false
        type: string
      minutes:
        description: Minutes to fuzz
        required: false
        default: "20"
        type: string

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache GPUI sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/zed
          key: zed-${{ hashFiles('scripts/fetch-gpui.sh', 'patches/gpui-*.patch') }}

      - name: Fetch GPUI
        run: ./scripts/fetch-gpui.sh

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Fuzz
        env:
          CROW_FUZZ_MINUTES: ${{ inputs.minutes || '20' }}
          CROW_FUZZ_SEED: ${{ inputs.seed }}
          CROW_FUZZ_SHRINK_SECS: '600'
          # Plain `file-000.txt` trees miss long names, NFC/NFD twins, newlines, deep trees,
          # symlink loops and unreadable folders; `small` builds them all but the two huge kinds.
          CROW_FUZZ_TREE: small
        run: python3 scripts/test-report.py run --mode fuzz --out "$RUNNER_TEMP/test-report-fuzz" -- cargo test -p crow-app fuzz_long -- --ignored --nocapture

      - name: Summary
        if: always()
        run: |
          {
            echo "## Fuzz run"
            echo
            python3 scripts/test-report.py summary "$RUNNER_TEMP/test-report-fuzz" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fuzz report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-report-fuzz
          path: ${{ runner.temp }}/test-report-fuzz
          if-no-files-found: warn
