[package]
name = "crow-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Crow, a Finder-style file explorer"

[[bin]]
name = "crow"
path = "src/main.rs"

[features]
# The fuzzer, its generator and invariants. Never enabled in the bundle; H3
# builds `crow --fuzz` with it, tests get it through `cfg(test)`.
fuzz = ["dep:rand", "dep:rand_chacha"]
# `crow --component-shot`: renders a Crow component to a PNG through GPUI's headless
# Metal renderer (gpui's `test-support`). Never enabled in the bundle.
component-shots = ["fuzz", "dep:image", "dep:gpui_apple", "gpui/test-support", "gpui_platform/test-support"]

[dependencies]
crow-core.workspace = true
# `testing` builds `--make-fixture` and the fuzzer's edge trees/churn.
crow-fs = { workspace = true, features = ["testing"] }
crow-macos.workspace = true
crow-plugin.workspace = true
crow-plugin-git.workspace = true
crow-search.workspace = true
crow-theme.workspace = true
anyhow = "1"
gpui.workspace = true
gpui_platform.workspace = true
chrono.workspace = true
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# The Mac text system without a platform (the platform needs the main thread; tests have none).
gpui_apple = { path = "../../vendor/zed/crates/gpui_apple", features = ["font-kit"], optional = true }
libc = "0.2"
notify.workspace = true
rand = { version = "0.9", optional = true }
rand_chacha = { version = "0.9", optional = true }
serde_json.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation = "1"
url = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_apple = { path = "../../vendor/zed/crates/gpui_apple", features = ["font-kit"] }
# `current_headless_renderer`, for the component shots' tests.
gpui_platform = { workspace = true, features = ["test-support"] }
rand = "0.9"
rand_chacha = "0.9"
