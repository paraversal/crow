[package]
name = "crow-macos"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The only crate that talks to AppKit: icons, Finder names, Quick Look, dragging"

[dependencies]
raw-window-handle.workspace = true
objc2 = "0.6"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGImage"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSGeometry", "NSObject", "NSData", "NSDictionary", "NSFileManager", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSView", "NSWindow", "NSResponder", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSEvent", "NSApplication", "objc2-core-graphics"] }
objc2-quick-look-ui = { version = "0.3", features = ["QLPreviewPanel", "QLPreviewItem", "objc2-app-kit"] }
