[package]
name = "crow-macos"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The only crate that talks to AppKit: icons, Finder names, Quick Look, dragging"

[dependencies]
crow-fs.workspace = true
raw-window-handle.workspace = true
objc2 = "0.6"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGImage"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSGeometry", "NSObject", "NSData", "NSDictionary", "NSFileManager", "NSValue", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSView", "NSWindow", "NSResponder", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSPasteboardItem", "NSEvent", "NSApplication", "objc2-core-graphics"] }
objc2-quick-look-ui = { version = "0.3", features = ["QLPreviewPanel", "QLPreviewItem", "objc2-app-kit"] }
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType"] }
objc2-quick-look-thumbnailing = { version = "0.3", features = ["QLThumbnailGenerator", "QLThumbnailGenerationRequest", "QLThumbnailRepresentation", "block2", "objc2-core-graphics"] }
block2 = "0.6"
